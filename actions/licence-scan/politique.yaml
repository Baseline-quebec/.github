# Politique de licences Baseline
#
# Ce fichier est la SEULE source de vérité de la politique. Il est lu par
# report.py, pas par Trivy : Trivy sert uniquement à extraire la licence de
# chaque dépendance, la classification se fait ici. Cela évite de dépendre du
# schéma de configuration de Trivy, qui ignore silencieusement les clés
# inconnues et donnerait une politique non appliquée sans aucune erreur.
#
# Les motifs sont des expressions régulières, insensibles à la casse, ancrées
# sur la totalité de l'identifiant SPDX normalisé.

# Bloquant : la PR ne peut pas être fusionnée.
# Licences qui interdisent l'usage commercial, ou qui le restreignent au point
# de compromettre une livraison client ou un hébergement en service.
interdites:
  motifs:
    # Non commerciales explicites
    - "CC-BY-NC(-SA|-ND)?-[0-9.]+"
    - "CC-NC.*"
    - "PolyForm-Noncommercial.*"
    - "PolyForm-Free-Trial.*"
    - "Prosperity.*"
    - "Commons-Clause"
    - "SAL-1\\.0"                 # Server Side Analytics License
    - "Parity.*"
    # Source-available à restrictions commerciales
    - "BUSL-1\\.1"                # Business Source License (HashiCorp, Sentry)
    - "BSL-1\\.1"                 # alias fréquent de BUSL, à ne pas confondre avec BSL-1.0 (Boost)
    - "SSPL(-1\\.0)?"             # MongoDB, Elasticsearch avant 2021
    - "Elastic-2\\.0"
    - "ELv2"
    - "RSAL.*"                    # Redis Source Available License
    - "Redis Source Available.*"
    - "Confluent-Community.*"
    - "MariaDB-BSL.*"
    # Clause de discrimination d'usage : non conforme à l'OSI, risque juridique
    - "JSON"                      # « shall be used for Good, not Evil »
    # Copyleft réseau. Bloquant chez Baseline par décision d'équipe : l'AGPL
    # contamine dès qu'un service est exposé, ce qui est le cas de la plupart de
    # nos livraisons. Cas concret ayant motivé la règle : PyMuPDF, à remplacer
    # par pypdfium2.
    - "AGPL-[0-9.]+(-only|-or-later)?"

# Non bloquant : signalé dans le rapport de la PR, à arbitrer au cas par cas.
# Licences copyleft. Le risque dépend de si on distribue le code au client ou
# qu'on l'expose en service, pas de la licence seule.
a_surveiller:
  motifs:
    - "GPL-[0-9.]+(-only|-or-later)?"
    - "LGPL-[0-9.]+(-only|-or-later)?"
    - "OSL-[0-9.]+"
    - "EUPL-[0-9.]+"
    - "CC-BY-SA-[0-9.]+"
    - "CC-BY-ND-[0-9.]+"
    - "CPAL-.*"
    - "SISSL"
    - "Watcom-1\\.0"

# Licences explicitement acceptées. Sert à taire le bruit connu, jamais à
# contourner la politique : `interdites` est évalué avant cette liste.
ignorees:
  motifs:
    - "MIT"
    - "MIT-0"
    - "Apache-2\\.0"
    - "BSD-2-Clause"
    - "BSD-3-Clause"
    - "ISC"
    - "0BSD"
    - "Unlicense"
    - "CC0-1\\.0"
    - "CC-BY-[0-9.]+"
    - "Python-2\\.0"
    - "PSF-2\\.0"
    - "Zlib"
    - "MPL-2\\.0"
    - "BSL-1\\.0"                 # Boost, permissive, à ne pas confondre avec BUSL-1.1

# Comportement sur une dépendance dont la licence est absente ou illisible.
# "signaler" : apparaît dans le rapport sans bloquer.
# "bloquer"  : traitée comme une licence interdite.
# "taire"    : ignorée complètement.
# Un paquet sans licence est juridiquement le plus risqué de tous, mais la
# métadonnée de licence Python reste sale malgré PEP 639, donc on signale
# plutôt que de bloquer tant que le volume réel n'est pas mesuré.
licence_inconnue: signaler

# Exceptions par paquet, à justifier. Une exception sans justification ni date
# de révision doit être refusée en revue de code.
# Exemple :
#   exceptions:
#     - paquet: "chardet"
#       licence: "LGPL-2.1"
#       raison: "Dépendance transitive de requests, usage interne seulement"
#       revoir_le: "2027-01-31"
exceptions: []
