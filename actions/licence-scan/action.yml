name: "Scan de conformité des licences"
description: >
  Installe les dépendances du dépôt, lit la licence déclarée par chacune dans
  ses métadonnées, puis applique la politique de licences Baseline. Bloque la
  PR si une licence non commerciale ou source-available restrictive est
  détectée.

inputs:
  mode:
    description: >
      "bloquant" fait échouer le job sur une licence interdite.
      "observation" produit le rapport sans jamais bloquer, pour mesurer le
      volume réel de violations avant d'activer l'application.
    required: false
    default: "observation"
  chemin:
    description: "Sous-répertoire à analyser, relatif à la racine du dépôt."
    required: false
    default: "."

outputs:
  interdites:
    description: "Nombre de licences interdites détectées."
    value: ${{ steps.rapport.outputs.interdites }}

runs:
  using: "composite"
  steps:
    - name: Détecter les gestionnaires de dépendances
      id: detection
      shell: bash
      working-directory: ${{ inputs.chemin }}
      run: |
        set -euo pipefail

        python_gest=aucun
        if [ -f uv.lock ]; then
          python_gest=uv
        elif [ -f poetry.lock ]; then
          python_gest=poetry
        elif [ -f requirements.txt ]; then
          python_gest=pip
        fi

        node_gest=aucun
        if [ -f pnpm-lock.yaml ]; then
          node_gest=pnpm
        elif [ -f package-lock.json ]; then
          node_gest=npm
        elif [ -f yarn.lock ]; then
          node_gest=yarn
        fi

        echo "python=$python_gest" >> "$GITHUB_OUTPUT"
        echo "node=$node_gest" >> "$GITHUB_OUTPUT"
        echo "Gestionnaire Python : $python_gest"
        echo "Gestionnaire Node : $node_gest"

        if [ "$python_gest" = "aucun" ] && [ "$node_gest" = "aucun" ]; then
          echo "::notice title=Aucune dépendance::Aucun fichier de verrouillage reconnu, rien à analyser."
        fi

    - name: Installer uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        enable-cache: true

    # La licence se lit dans les métadonnées des paquets INSTALLÉS : ni uv.lock
    # ni poetry.lock ne portent cette information. Sans installation, le scan
    # retourne zéro licence, ce qui ressemble à un succès. L'environnement
    # virtuel doit être créé DANS le dépôt pour être trouvé.
    - name: Installer les dépendances Python
      if: steps.detection.outputs.python != 'aucun'
      shell: bash
      working-directory: ${{ inputs.chemin }}
      env:
        GESTIONNAIRE: ${{ steps.detection.outputs.python }}
      run: |
        set -euo pipefail
        case "$GESTIONNAIRE" in
          uv)
            uv sync --all-extras --frozen
            ;;
          poetry)
            uv tool install poetry
            poetry config virtualenvs.in-project true --local
            poetry install --no-interaction --no-root
            ;;
          pip)
            uv venv
            uv pip install --requirement requirements.txt
            ;;
        esac

    - name: Installer Node
      if: steps.detection.outputs.node != 'aucun'
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "22"

    # --ignore-scripts : les scripts postinstall ne changent rien aux licences
    # déclarées et exécuter du code arbitraire de dépendances tierces dans la CI
    # est une surface d'attaque gratuite.
    - name: Installer les dépendances Node
      if: steps.detection.outputs.node != 'aucun'
      shell: bash
      working-directory: ${{ inputs.chemin }}
      env:
        GESTIONNAIRE: ${{ steps.detection.outputs.node }}
      run: |
        set -euo pipefail
        case "$GESTIONNAIRE" in
          npm)
            npm ci --ignore-scripts
            ;;
          pnpm)
            corepack enable
            pnpm install --frozen-lockfile --ignore-scripts
            ;;
          yarn)
            corepack enable
            yarn install --immutable --mode=skip-build || yarn install --frozen-lockfile --ignore-scripts
            ;;
        esac

    - name: Extraire les licences déclarées
      shell: bash
      working-directory: ${{ inputs.chemin }}
      env:
        SORTIE: ${{ runner.temp }}/licences.json
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        uv run --no-project python "$ACTION_PATH/extraire.py" --racine . --sortie "$SORTIE"

    - name: Appliquer la politique
      id: rapport
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        RAPPORT: ${{ runner.temp }}/licences.json
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        options=(--rapport-trivy "$RAPPORT" --politique "$ACTION_PATH/politique.yaml")
        if [ "$MODE" != "bloquant" ]; then
          options+=(--sans-blocage)
        fi
        uv run --no-project --with pyyaml python "$ACTION_PATH/report.py" "${options[@]}"
