name: "Scan de conformité des licences"
description: >
  Installe les dépendances du dépôt, lit la licence déclarée par chacune dans
  ses métadonnées, puis applique la politique de licences Baseline. Bloque la
  PR si une licence non commerciale ou source-available restrictive est
  détectée.

inputs:
  mode:
    description: >
      "bloquant" fait échouer le job sur une licence interdite.
      "observation" produit le rapport sans jamais bloquer, pour mesurer le
      volume réel de violations avant d'activer l'application.
    required: false
    default: "observation"
  chemin:
    description: "Sous-répertoire à analyser, relatif à la racine du dépôt."
    required: false
    default: "."
  rapport-json:
    description: >
      Chemin où écrire les constats en JSON. Utilisé par le rapport mensuel de
      l'organisation, qui agrège un fichier par dépôt. Vide pour ne rien écrire.
    required: false
    default: ""
  depot:
    description: >
      Nom du dépôt analysé, tel qu'il doit apparaître dans le rapport. Le défaut
      convient à l'exécution imposée sur une pull request, où le dépôt courant
      EST le dépôt analysé. Le balayage mensuel doit passer `matrix.depot` :
      il tourne dans `.github` et scanne un autre dépôt à chaque job de matrice,
      donc le défaut nommerait `.github` dans les 118 rapports et le dépôt
      réellement touché n'apparaîtrait nulle part. Constaté le 2026-09-01 : neuf
      dépôts distincts rapportés sous le même nom dans Slack.
    required: false
    default: ${{ github.repository }}

outputs:
  interdites:
    description: "Nombre de licences interdites détectées."
    value: ${{ steps.rapport.outputs.interdites }}

runs:
  using: "composite"
  steps:
    - name: Détecter les gestionnaires de dépendances
      id: detection
      shell: bash
      working-directory: ${{ inputs.chemin }}
      run: |
        set -euo pipefail

        python_gest=aucun
        if [ -f uv.lock ]; then
          python_gest=uv
        elif [ -f poetry.lock ]; then
          python_gest=poetry
        elif [ -f requirements.txt ]; then
          python_gest=pip
        fi

        node_gest=aucun
        if [ -f pnpm-lock.yaml ]; then
          node_gest=pnpm
        elif [ -f package-lock.json ]; then
          node_gest=npm
        elif [ -f yarn.lock ]; then
          node_gest=yarn
        fi

        echo "python=$python_gest" >> "$GITHUB_OUTPUT"
        echo "node=$node_gest" >> "$GITHUB_OUTPUT"
        echo "Gestionnaire Python : $python_gest"
        echo "Gestionnaire Node : $node_gest"

        if [ "$python_gest" = "aucun" ] && [ "$node_gest" = "aucun" ]; then
          echo "::notice title=Aucune dépendance::Aucun fichier de verrouillage reconnu, rien à analyser."
        fi

    - name: Installer uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        enable-cache: true

    # La licence se lit dans les métadonnées des paquets INSTALLÉS : ni uv.lock
    # ni poetry.lock ne portent cette information. Sans installation, le scan
    # retourne zéro licence, ce qui ressemble à un succès. L'environnement
    # virtuel doit être créé DANS le dépôt pour être trouvé.
    # En mode observation, un échec d'installation devient un avertissement et
    # non un échec de job. Le ruleset qui impose ce workflow doit être en
    # application Active pour que le workflow s'exécute du tout : en mode
    # Evaluate, GitHub journalise la règle sans jamais lancer le workflow. Le
    # niveau d'application vit donc ici, dans `mode`, et non dans le ruleset.
    # Sans ce garde-fou, un dépôt dont l'installation casse verrouillerait ses
    # pull requests alors qu'on cherche seulement à mesurer.
    - name: Installer les dépendances Python
      if: steps.detection.outputs.python != 'aucun'
      shell: bash
      working-directory: ${{ inputs.chemin }}
      env:
        GESTIONNAIRE: ${{ steps.detection.outputs.python }}
        MODE: ${{ inputs.mode }}
      run: |
        set -uo pipefail
        installer() {
          case "$GESTIONNAIRE" in
            uv)
              uv sync --all-extras --frozen
              ;;
            poetry)
              uv tool install poetry
              poetry config virtualenvs.in-project true --local
              poetry install --no-interaction --no-root
              ;;
            pip)
              uv venv
              uv pip install --requirement requirements.txt
              ;;
          esac
        }

        if installer; then
          exit 0
        fi

        if [ "$MODE" = "bloquant" ]; then
          echo "::error title=Installation impossible::Les dépendances Python n'ont pas pu être installées, les licences ne peuvent pas être lues."
          exit 1
        fi
        echo "::warning title=Installation impossible::Les dépendances Python n'ont pas pu être installées. Le rapport de licences sera vide, ce n'est pas un signe de conformité."

    - name: Installer Node
      if: steps.detection.outputs.node != 'aucun'
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "22"

    # --ignore-scripts : les scripts postinstall ne changent rien aux licences
    # déclarées et exécuter du code arbitraire de dépendances tierces dans la CI
    # est une surface d'attaque gratuite.
    - name: Installer les dépendances Node
      if: steps.detection.outputs.node != 'aucun'
      shell: bash
      working-directory: ${{ inputs.chemin }}
      env:
        GESTIONNAIRE: ${{ steps.detection.outputs.node }}
        MODE: ${{ inputs.mode }}
      run: |
        set -uo pipefail
        installer() {
          case "$GESTIONNAIRE" in
            npm)
              npm ci --ignore-scripts
              ;;
            pnpm)
              corepack enable
              pnpm install --frozen-lockfile --ignore-scripts
              ;;
            yarn)
              corepack enable
              yarn install --immutable --mode=skip-build ||
                yarn install --frozen-lockfile --ignore-scripts
              ;;
          esac
        }

        if installer; then
          exit 0
        fi

        if [ "$MODE" = "bloquant" ]; then
          echo "::error title=Installation impossible::Les dépendances Node n'ont pas pu être installées, les licences ne peuvent pas être lues."
          exit 1
        fi
        echo "::warning title=Installation impossible::Les dépendances Node n'ont pas pu être installées. Le rapport de licences sera incomplet."

    - name: Extraire les licences déclarées
      shell: bash
      working-directory: ${{ inputs.chemin }}
      env:
        SORTIE: ${{ runner.temp }}/licences.json
        ACTION_PATH: ${{ github.action_path }}
        MODE: ${{ inputs.mode }}
      run: |
        set -uo pipefail
        if uv run --no-project python "$ACTION_PATH/extraire.py" --racine . --sortie "$SORTIE"; then
          exit 0
        fi
        if [ "$MODE" = "bloquant" ]; then
          exit 1
        fi
        echo "::warning title=Extraction impossible::Les métadonnées de licence n'ont pas pu être lues."
        echo '{"Results": []}' > "$SORTIE"

    - name: Appliquer la politique
      id: rapport
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        RAPPORT: ${{ runner.temp }}/licences.json
        ACTION_PATH: ${{ github.action_path }}
        RAPPORT_JSON: ${{ inputs.rapport-json }}
        DEPOT: ${{ inputs.depot }}
      run: |
        set -euo pipefail
        options=(--rapport-trivy "$RAPPORT" --politique "$ACTION_PATH/politique.yaml")
        if [ "$MODE" != "bloquant" ]; then
          options+=(--sans-blocage)
        fi
        if [ -n "$RAPPORT_JSON" ]; then
          options+=(--sortie-json "$RAPPORT_JSON")
        fi
        # Une entrée vide laisse le defaut de report.py decider plutot que
        # d'ecrire un nom vide dans le rapport agrege.
        if [ -n "$DEPOT" ]; then
          options+=(--depot "$DEPOT")
        fi
        uv run --no-project --with pyyaml python "$ACTION_PATH/report.py" "${options[@]}"
