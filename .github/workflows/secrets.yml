# Workflow central des secrets : gitleaks seul, sur ce que la pull request apporte.
#
# Il n'est PAS destiné à être copié dans les dépôts. Il est imposé par un
# ruleset au niveau de l'organisation (règle « Require workflows to pass before
# merging ») qui vise `develop` (la branche d'intégration), et GitHub l'exécute
# dans le contexte de chaque dépôt ciblé.
#
# Le ruleset ne vise JAMAIS toutes les branches : cette règle bloque les pushs
# directs sur les branches ciblées, et ne convient qu'à des branches alimentées
# par pull request seulement. Une pull request vers une autre branche n'a donc
# aucun check requis.
#
# Son pendant, `conformite.yml`, porte les cinq contrôles complets et n'est
# requis que sur la branche par défaut (la promotion vers la production). Une
# pull request vers `develop` ne passe que par celui-ci ; une pull request vers
# la branche par défaut passe par les deux, et le scan des secrets y est fait
# deux fois (coût accepté : il dure quelques secondes).
#
# POURQUOI DEUX WORKFLOWS ET NON UN SEUL AVEC UNE CONDITION
#
# Un choix fait dans le workflow d'après la branche cible se contourne : recibler
# une pull request ne relance pas le check, et le résultat resterait celui de
# l'ancienne cible. Avec deux rulesets, c'est GitHub qui exige le bon workflow
# pour la cible courante (sans lui sur le SHA, la fusion reste bloquée).
#
# POURQUOI UN SEUL JOB
#
# Un job GitHub est facturé à la MINUTE ENTIÈRE. Ce workflow est court (le scan
# lit quelques fichiers) : un seul job, sans étapes superflues, c'est une minute.
# Voir `conformite.yml` pour le calcul qui a conduit à réunir les contrôles.
#
# CE QUI EST LU. `git log -p` seul laisse des trous que le dépôt peut ouvrir
# lui-même, ce que la décision D3 (aucune exclusion) interdit : un
# `.gitattributes` avec `* -diff`, un fichier marqué `binary` ou contenant un
# octet NUL ne produisent que « Binary files differ », que gitleaks saute
# (sources/git.go, v8.30.1), et un commit de fusion n'a pas de diff. Deux lectures :
#
# 1. le DIFF NET, de la cible à la fusion de test (`HEAD^1` vers `HEAD`), lu avec
#    `gitleaks dir` sur les fichiers modifiés copiés tels que la fusion les
#    produit. La liste vient de `git diff --name-only`, que ni les attributs ni
#    un octet NUL ne masquent, et elle contient ce que les fusions de la branche
#    ont résolu. Même moteur que le scan de l'arbre : jamais moins que lui pour
#    ce qui entre dans la cible.
# 2. l'HISTORIQUE `HEAD^1..HEAD^2`, pour un secret ajouté puis retiré dans la pull
#    request (il reste lisible dans ses commits). `--text` lit même un fichier
#    « binaire » ou `-diff`, `--diff-merges=first-parent` montre le diff des
#    fusions de la branche. gitleaks v8.30.1 transmet `--log-opts` tel quel à
#    `git log -p -U0`, séparé aux espaces (sources/git.go, NewGitLogCmdContext) ;
#    sans plage il lirait `--all`.
#
# `HEAD^1` est la cible TELLE QU'ELLE EST MAINTENANT (premier parent de la fusion
# de test, `refs/pull/N/merge`) et `HEAD^2` la tête de la pull request :
# `pull_request.base.sha` peut être périmé. Si la plage ou la liste des fichiers
# ne peut pas s'établir (historique tronqué, pas de fusion, ancêtre commun
# introuvable, copie impossible), le scan retombe sur l'ARBRE COMPLET : jamais
# « rien scanné, vert ». merge_group et workflow_dispatch lisent l'arbre complet.
#
# Les options sont celles de D3 (2026-10-09) : configuration par défaut imposée,
# aucune exclusion, `gitleaks:allow` et `.gitleaksignore` ignorés, `--redact`,
# image épinglée par empreinte (v8.30.1, index multi-plateforme).
#
# Les exceptions datées sont les mêmes que dans `conformite.yml` ; un test
# vérifie que les deux listes restent identiques. Le tag `v2` des actions ne
# sert pas ici : une action commune n'existerait au tag qu'après la fusion, ce
# qui ferait échouer ce workflow imposé sur toutes les pull requests entre-temps.
#
# Le déclencheur n'est ici que pour les exécutions dans ce dépôt-ci : en
# exécution imposée, GitHub force ses propres événements et ignore le bloc `on`.

name: Secrets Baseline

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets Baseline
    # Ce depot-ci est exclu, comme pour `conformite.yml` : les contrôles y sont
    # exercés par la CI (tests de ce workflow), pas par l'exécution imposée.
    if: github.repository != 'Baseline-quebec/.github'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Historique complet pour une pull request : il faut atteindre l'ancêtre
      # commun entre la cible et la branche, à profondeur inconnue. Chaînes '0' et
      # '1' : le nombre 0 est faux et donnerait toujours 1 avec `&& ... ||`.
      - name: Récupérer le dépôt
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      # Pas de `if: always()` : si le checkout échoue, il n'y a rien à scanner et
      # le job doit rougir, pas passer au vert sur un dossier vide.
      - name: Chercher les secrets (gitleaks, bloquant)
        id: secrets
        shell: bash
        env:
          EVENEMENT: ${{ github.event_name }}
          CIBLE: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          # Configuration par défaut imposée par GITLEAKS_CONFIG_TOML : elle
          # passe avant un .gitleaks.toml du dépôt, qui pourrait sinon y
          # ajouter des exclusions. Commentaires gitleaks:allow et
          # .gitleaksignore ignorés pour la même raison.
          #
          # `--gitleaks-ignore-path /dev/null` ne suffit PAS : gitleaks lit en
          # plus le .gitleaksignore à la racine de la source. Le fichier est donc
          # retiré de l'espace de travail (le checkout jetable du runner, pas le
          # dépôt), puis remis. Il n'est jamais copié dans le diff net non plus.
          ignore_present=false
          if [ -e .gitleaksignore ] || [ -L .gitleaksignore ]; then
            ignore_present=true
            echo "::warning title=gitleaks::.gitleaksignore du dépôt non pris en compte (décision D3 : aucune exclusion)."
            mv .gitleaksignore "$RUNNER_TEMP/gitleaksignore.depot"
          fi
          mkdir -p "$RUNNER_TEMP/gitleaks"
          portee=arbre
          net="$RUNNER_TEMP/diff-net"
          if [ "$EVENEMENT" = pull_request ]; then
            raison=""
            base_sha=$(git rev-parse --verify --quiet 'HEAD^1^{commit}') || base_sha=""
            tete_sha=$(git rev-parse --verify --quiet 'HEAD^2^{commit}') || tete_sha=""
            if [ "$(git rev-parse --is-shallow-repository)" != false ]; then
              raison="historique tronqué"
            elif [ -z "$base_sha" ] || [ -z "$tete_sha" ]; then
              raison="commit de fusion ou parents introuvables"
            elif ! git merge-base "$base_sha" "$tete_sha" > /dev/null 2>&1; then
              raison="ancêtre commun introuvable"
            else
              liste="$RUNNER_TEMP/fichiers-diff.liste"
              rm -rf "$net"
              mkdir -p "$net"
              # `.gitleaksignore` est exclu de la liste : il a ete mis de cote plus
              # haut (absent de l'espace de travail), donc tar echouerait a le
              # copier et le scan retomberait a tort sur l'arbre complet. Jamais
              # copie, jamais lu.
              if ! git diff --name-only -z --no-renames --diff-filter=d HEAD^1 HEAD \
                -- . ':(exclude,top).gitleaksignore' > "$liste"; then
                raison="liste des fichiers modifiés impossible à établir"
              elif [ -s "$liste" ] \
                && ! (tar -c --null --no-unquote --verbatim-files-from --no-recursion \
                  -T "$liste" | tar -x -C "$net"); then
                raison="copie des fichiers modifiés impossible"
              fi
              rm -f "$net/.gitleaksignore"
            fi
            if [ -n "$raison" ]; then
              echo "::warning title=gitleaks::Diff de la pull request vers $CIBLE impossible à établir ($raison) : arbre complet scanné à la place."
            else
              portee=diff
              echo "Scan du diff net (HEAD^1 vers HEAD, $(tr -cd '\0' < "$liste" | wc -c) fichier(s)) et de l'historique ${base_sha}..${tete_sha}"
            fi
          fi
          echo "portee=$portee" >> "$GITHUB_OUTPUT"
          # `--exit-code 2` : un secret trouvé sort en 2, alors qu'une erreur
          # technique de gitleaks sort en 1. Les deux bloquent ; seul le message
          # diffère (voir « Verdict »).
          lancer() {
            local source=$1 rapport=$2
            shift 2
            docker run --rm -v "$source":/src:ro -v "$RUNNER_TEMP/gitleaks":/out \
              -e GITLEAKS_CONFIG_TOML=$'[extend]\nuseDefault = true' \
              ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
              "$@" --redact --no-banner --ignore-gitleaks-allow \
              --gitleaks-ignore-path /dev/null --exit-code 2 \
              --report-format json --report-path "/out/$rapport"
          }
          statuts=()
          if [ "$portee" = diff ]; then
            statut=0
            lancer "$net" gitleaks-diff-net.json dir /src || statut=$?
            statuts+=("$statut")
            statut=0
            lancer "$PWD" gitleaks-historique.json git /src \
              "--log-opts=--text --diff-merges=first-parent ${base_sha}..${tete_sha}" || statut=$?
            statuts+=("$statut")
          else
            statut=0
            lancer "$PWD" gitleaks.json dir /src || statut=$?
            statuts+=("$statut")
          fi
          if [ "$ignore_present" = true ]; then
            mv "$RUNNER_TEMP/gitleaksignore.depot" .gitleaksignore
          fi
          # Nature du résultat : `technique` l'emporte sur `secret`.
          nature=aucune
          for st in "${statuts[@]}"; do
            if [ "$st" -eq 0 ]; then
              continue
            elif [ "$st" -eq 2 ]; then
              [ "$nature" = technique ] || nature=secret
            else
              nature=technique
            fi
          done
          echo "nature=$nature" >> "$GITHUB_OUTPUT"
          # Exceptions par dépôt, datées : seule dérogation à D3. Une ligne par
          # dépôt (« dépôt:date de fin AAAAMMJJ »), avec la décision en
          # commentaire. Le dépôt n'est pas exempté du scan : un secret y
          # produit un avertissement au lieu de bloquer, jusqu'à la date. Une
          # erreur technique n'est jamais excusée.
          #   decor-st-Canevas : secrets de la cliente, encore utilisés par
          #   elle (décision du DG du 2026-10-12, demande de F. Paradis).
          exceptions="Baseline-quebec/decor-st-Canevas:20270412"
          for e in $exceptions; do
            if [ "${e%%:*}" = "$GITHUB_REPOSITORY" ] && [ "$nature" = secret ] \
              && [ "$(date -u +%Y%m%d)" -le "${e##*:}" ]; then
              echo "::warning title=gitleaks::Secret en clair trouvé. Dépôt en exception jusqu'au ${e##*:} (décision du DG du 2026-10-12) : avertissement seulement."
              exit 0
            fi
          done
          if [ "$nature" = technique ]; then
            echo "::error title=gitleaks::Erreur technique du scan (ce n'est pas un secret trouvé). Le contrôle échoue par sécurité : relancer, puis voir le journal."
          fi
          [ "$nature" = aucune ] || exit 1

      # Sans ce récapitulatif, le résumé du job ne dirait ni ce qui a été lu, ni
      # si un échec est un secret ou une erreur de scan. Une étape qui n'a pas
      # tourné est écrite « non exécuté », jamais comptée comme propre.
      - name: Verdict
        if: always()
        shell: bash
        env:
          SECRETS: ${{ steps.secrets.outcome }}
          PORTEE: ${{ steps.secrets.outputs.portee }}
          NATURE: ${{ steps.secrets.outputs.nature }}
          EVENEMENT: ${{ github.event_name }}
          CIBLE: ${{ github.base_ref }}
        run: |
          case "$EVENEMENT" in
            pull_request) mode="PR vers $CIBLE : secrets" ;;
            *) mode="$EVENEMENT : secrets" ;;
          esac
          if [ "$PORTEE" = diff ]; then
            portee="diff net et historique de la pull request"
          elif [ "$EVENEMENT" = pull_request ] && [ -n "$PORTEE" ]; then
            portee="arbre complet (repli : diff impossible à établir)"
          elif [ -n "$PORTEE" ]; then
            portee="arbre complet"
          else
            portee="non exécuté"
          fi
          if [ "$SECRETS" = skipped ] || [ -z "$SECRETS" ]; then
            resultat="non exécuté"
          else
            resultat="$SECRETS"
          fi
          if [ "$SECRETS" = success ] && [ "$NATURE" = secret ]; then
            detail="secret trouvé mais dépôt en exception datée : avertissement seulement"
          elif [ "$SECRETS" = failure ] && [ "$NATURE" = technique ]; then
            detail="erreur technique du scan gitleaks (aucun secret établi, scan à relancer)"
          elif [ "$SECRETS" = failure ]; then
            detail="secret en clair trouvé par gitleaks"
          else
            detail=""
          fi
          echo "Mode                        : $mode"
          echo "Secrets en clair (gitleaks) : $resultat ($portee)"
          [ -z "$detail" ] || echo "gitleaks : $detail"
          {
            echo "### Secrets Baseline : $mode"
            echo
            echo "| Contrôle | Verdict |"
            echo "|---|---|"
            echo "| Secrets en clair (gitleaks, bloquant) : $portee | $resultat |"
            if [ -n "$detail" ]; then
              echo
              echo "gitleaks : $detail"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SECRETS" != success ]; then
            echo "::error title=Secrets Baseline::Le scan des secrets n'est pas passé ($resultat). Voir le récapitulatif ci-dessus."
            exit 1
          fi
