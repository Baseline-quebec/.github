# Workflow central d'audit de sécurité du code.
#
# Il n'est PAS destiné à être copié dans les dépôts. Il est imposé par un
# ruleset au niveau de l'organisation (règle « Require workflows to pass before
# merging ») et GitHub l'exécute dans le contexte de chaque dépôt ciblé.
#
# Conséquence importante : les déclencheurs ci-dessous ne s'appliquent qu'aux
# exécutions dans ce dépôt-ci. Quand le workflow est imposé par un ruleset,
# GitHub force `pull_request` et `merge_group` et ignore ce bloc `on`. Il n'est
# donc pas possible de déclencher sur un push direct vers `main` par ce
# mécanisme : pour couvrir ce cas, il faut interdire le push direct en exigeant
# une pull request dans le même ruleset.
#
# Pour modifier le seuil de blocage, éditer actions/secaudit-code/politique.yaml
# puis déplacer le tag v1 : les dépôts suivent sans aucune modification.

name: Audit de sécurité du code

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      mode:
        description: "bloquant ou observation"
        type: choice
        options: ["observation", "bloquant"]
        default: "observation"

permissions:
  contents: read

concurrency:
  group: secaudit-code-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  securite:
    name: Secrets, code et configuration
    # Ce depot-ci est exclu : le `uses` ci-dessous pointe vers le tag v1, et le
    # tag ne porte le nouveau controle qu'APRES la fusion. Sans cette garde, la
    # pull request qui introduit un controle echouerait toujours sur un
    # « action introuvable ». L'action est exercee ici par la CI, qui l'appelle
    # par son chemin local (./actions/...), ce que l'execution imposee ne peut
    # pas faire.
    if: github.repository != 'Baseline-quebec/.github'
    runs-on: ubuntu-latest
    # Six outils dont trois images Docker à tirer. Vingt minutes suffisent
    # largement sur nos dépôts ; au-delà, c'est un scanner bloqué, pas un dépôt
    # gros, et l'échec doit arriver vite pour être diagnostiqué.
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Référence pleinement qualifiée obligatoire : en exécution imposée, le
      # dépôt courant est le dépôt cible, donc un chemin relatif « ./actions/... »
      # pointerait dans le vide.
      - name: Auditer le code
        uses: Baseline-quebec/.github/actions/secaudit-code@v1
        with:
          mode: ${{ inputs.mode || 'observation' }}
