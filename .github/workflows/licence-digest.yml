# Rapport mensuel de licences pour toute l'organisation.
#
# Complémentaire au scan imposé sur pull request, qui ne voit qu'un dépôt à la
# fois et ne dit rien de l'état d'ensemble. Ce rapport répond à une question
# différente : quels projets portent aujourd'hui une dépendance dont la licence
# demande un arbitrage.
#
# Chaque dépôt est scanné par un job de matrice qui réutilise EXACTEMENT la même
# action que les pull requests. Le rapport mensuel et le blocage en PR ne
# peuvent donc pas diverger : une seule politique, un seul extracteur.
#
# Le message part dans team-dev, formaté par le script Windmill de
# baseline-automation, là où se trouvent le jeton Slack et les conventions de
# rapport de l'équipe.

name: Rapport mensuel des licences

on:
  schedule:
    - cron: "0 9 1 * *" # Le 1er de chaque mois, apres le balayage des modeles
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: licence-digest
  cancel-in-progress: false

jobs:
  lister:
    name: Lister les depots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      depots: ${{ steps.liste.outputs.depots }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Obtenir un jeton d'installation
        id: jeton
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ORG_SWEEP_APP_ID }}
          private-key: ${{ secrets.ORG_SWEEP_APP_KEY }}
          owner: ${{ github.repository_owner }}

      # Trois exclusions, trois raisons differentes, toutes deliberees :
      #   .github               heberge le balayage, se scanner soi-meme n'a
      #                         aucun sens dans un rapport d'organisation
      #   baseline-automation   psycopg en LGPL-3.0, code heberge chez nous et
      #                         jamais livre au client, donc aucun arbitrage a
      #                         rendre chaque mois (decision du 2026-09-01)
      #   assistant-comite-rh   codespell en GPL-2.0, un linter de dev qui ne
      #                         part dans aucune livraison (idem)
      #
      # Ces deux derniers restent couverts par le scan impose sur pull request,
      # qui est de toute facon le controle qui compte : une licence change au
      # moment du bump, pas entre deux balayages.
      - name: Enumerer
        id: liste
        env:
          GH_TOKEN: ${{ steps.jeton.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=Jeton manquant::Les secrets ORG_SWEEP_APP_ID et ORG_SWEEP_APP_KEY sont requis."
            exit 1
          fi
          uv run --no-project python actions/sweep/sweep.py lister \
            --exclure .github,baseline-automation,assistant-comite-rh

  scanner:
    name: ${{ matrix.depot }}
    needs: lister
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Un depot dont l'installation casse ne doit pas annuler les autres, et
    # ne doit pas non plus faire echouer le rapport : il sera simplement absent
    # du total analyse, ce que le message rend visible.
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        depot: ${{ fromJson(needs.lister.outputs.depots) }}
    steps:
      - name: Obtenir un jeton d'installation
        id: jeton
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ORG_SWEEP_APP_ID }}
          private-key: ${{ secrets.ORG_SWEEP_APP_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Recuperer le depot analyse
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ matrix.depot }}
          token: ${{ steps.jeton.outputs.token }}

      # `depot` est obligatoire ici : sans lui l'action nomme le depot courant,
      # c'est-a-dire `.github`, et le rapport agrege attribue les licences de
      # tous les depots a celui qui heberge le workflow.
      - name: Analyser les licences
        uses: Baseline-quebec/.github/actions/licence-scan@v1
        with:
          mode: observation
          rapport-json: ${{ runner.temp }}/rapport.json
          depot: ${{ matrix.depot }}

      - name: Nommer le rapport
        id: nom
        env:
          DEPOT: ${{ matrix.depot }}
        run: echo "fichier=${DEPOT//\//-}" >> "$GITHUB_OUTPUT"

      - name: Conserver le rapport
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: licences-${{ steps.nom.outputs.fichier }}
          path: ${{ runner.temp }}/rapport.json
          if-no-files-found: ignore
          retention-days: 7

  rapport:
    name: Poster le rapport
    needs: scanner
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Rassembler les rapports
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          path: rapports
          pattern: licences-*

      - name: Agreger
        run: |
          set -euo pipefail
          uv run --no-project python actions/licence-scan/digest.py \
            --dossier rapports --sortie resume.json

      - name: Envoyer dans Slack
        env:
          WINDMILL_WEBHOOK_URL: ${{ vars.WINDMILL_RAPPORT_CONFORMITE_URL }}
          WINDMILL_TOKEN: ${{ secrets.WINDMILL_TOKEN }}
        run: |
          set -euo pipefail
          uv run --no-project python actions/sweep/sweep.py envoyer \
            --type-rapport licences --fichier resume.json
