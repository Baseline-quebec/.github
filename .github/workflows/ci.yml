name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qualite:
    name: Lint et tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Ruff
        run: uv run --no-project --with ruff ruff check actions/

      - name: Format
        run: uv run --no-project --with ruff ruff format --check actions/

      # Chaque action est testée depuis son propre dossier : les scripts sont
      # appelés en ligne de commande depuis un workflow, jamais importés comme
      # un paquet, et les tests reproduisent cette façon de les charger.
      #
      # Le dossier est découvert, pas énuméré : une liste en dur avait déjà
      # laissé actions/sweep hors de la CI, c'est-à-dire un module partagé par
      # les deux balayages dont les tests ne tournaient jamais.
      - name: Tests
        shell: bash
        run: |
          set -euo pipefail
          for dossier in actions/*/; do
            # Un dossier d'action sans test est une regression a part entiere :
            # il passerait la CI en silence.
            if ! compgen -G "$dossier/test_*.py" > /dev/null; then
              echo "::error title=Aucun test::$dossier ne contient aucun fichier test_*.py"
              exit 1
            fi
            echo "::group::$dossier"
            (cd "$dossier" && uv run --no-project --with pyyaml --with pytest python -m pytest -q)
            echo "::endgroup::"
          done

  # Exerce les actions de securite de bout en bout, sur ce depot-ci, par leur
  # chemin local. C'est la seule facon de les tester avant que le tag v1 ne les
  # porte : les workflows imposes referencent l'action par ce tag, donc ils ne
  # peuvent pas valider la version en cours de revue.
  #
  # Les deux jobs tournent en mode observation. Un constat sur ce depot ne doit
  # pas bloquer la pull request qui corrige justement le scanner.
  secaudit-local:
    name: Audit de securite (chemin local)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./actions/secaudit-code
        with:
          mode: observation

  cve-local:
    name: Scan CVE (chemin local)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./actions/cve-scan
        with:
          mode: observation

  # Vérifie que les politiques restent chargeables et que les motifs compilent.
  # Une regex invalide dans un politique.yaml casserait le scan de tous les
  # dépôts de l'organisation d'un coup.
  politique:
    name: Validité des politiques
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Charger la politique de licences
        working-directory: actions/licence-scan
        run: |
          uv run --no-project --with pyyaml python -c "
          from report import Politique
          p = Politique.charger(__import__('pathlib').Path('politique.yaml'))
          print(f'{len(p.interdites)} motifs interdits, {len(p.a_surveiller)} à surveiller, {len(p.ignorees)} ignorés')
          assert p.interdites, 'La politique ne bloque plus rien'
          "

      # Les exemptions de sécurité doivent toutes porter une date : sans elle,
      # une exemption prise pour débloquer une livraison devient permanente.
      - name: Charger les politiques de securite
        run: |
          set -euo pipefail
          uv run --no-project --with pyyaml python -c "
          import sys
          from pathlib import Path
          sys.path.insert(0, 'actions/commun')
          from politique import Politique
          for chemin in ('actions/secaudit-code/politique.yaml', 'actions/cve-scan/politique.yaml'):
              p = Politique.charger(Path(chemin))
              assert p.bloquantes, f'{chemin} ne bloque plus rien'
              echues = [e for e in p.exemptions if e.expire is None]
              assert not echues, f'{chemin} : exemption sans date d expiration'
              print(f'{chemin} : {len(p.bloquantes)} severites bloquantes, {len(p.exemptions)} exemptions')
          "
