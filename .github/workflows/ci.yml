name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qualite:
    name: Lint et tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Ruff
        run: uv run --no-project --with ruff ruff check actions/

      - name: Format
        run: uv run --no-project --with ruff ruff format --check actions/

      - name: Tests
        working-directory: actions/licence-scan
        run: uv run --no-project --with pyyaml --with pytest python -m pytest test_report.py -q

  # Vérifie que la politique reste chargeable et que les motifs compilent.
  # Une regex invalide dans politique.yaml casserait le scan de tous les dépôts
  # de l'organisation d'un coup.
  politique:
    name: Validité de la politique
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Charger la politique
        working-directory: actions/licence-scan
        run: |
          uv run --no-project --with pyyaml python -c "
          from report import Politique
          p = Politique.charger(__import__('pathlib').Path('politique.yaml'))
          print(f'{len(p.interdites)} motifs interdits, {len(p.a_surveiller)} à surveiller, {len(p.ignorees)} ignorés')
          assert p.interdites, 'La politique ne bloque plus rien'
          "
