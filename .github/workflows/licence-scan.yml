# Workflow central de conformité des licences.
#
# Il n'est PAS destiné à être copié dans les dépôts. Il est imposé par un
# ruleset au niveau de l'organisation (règle « Require workflows to pass before
# merging ») et GitHub l'exécute dans le contexte de chaque dépôt ciblé.
#
# Conséquence importante : les déclencheurs ci-dessous ne s'appliquent qu'aux
# exécutions dans ce dépôt-ci. Quand le workflow est imposé par un ruleset,
# GitHub force `pull_request` et `merge_group` et ignore ce bloc `on`. Il n'est
# donc pas possible de déclencher sur un push direct vers `main` par ce
# mécanisme : pour couvrir ce cas, il faut interdire le push direct en exigeant
# une pull request dans le même ruleset.
#
# Pour modifier la politique de licences, éditer actions/licence-scan/politique.yaml
# puis déplacer le tag v1 : les dépôts suivent sans aucune modification.

name: Conformité des licences

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      mode:
        description: "bloquant ou observation"
        type: choice
        options: ["observation", "bloquant"]
        default: "observation"

permissions:
  contents: read

concurrency:
  group: licence-scan-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licences:
    name: Licences des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Référence pleinement qualifiée obligatoire : en exécution imposée, le
      # dépôt courant est le dépôt cible, donc un chemin relatif « ./actions/... »
      # pointerait dans le vide.
      - name: Analyser les licences
        uses: Baseline-quebec/.github/actions/licence-scan@v1
        with:
          mode: ${{ inputs.mode || 'observation' }}
